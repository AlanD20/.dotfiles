onboarding = false
# Adapted from tmux/.config/tmux/tmux.conf for Herdr 0.8.2.
# Prefix means press Ctrl+A, release, then press the action key.

[theme]
name = "catppuccin"
auto_switch = false

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
reload_config = "prefix+shift+r"
detach = "prefix+d"
close_workspace = "prefix+shift+q"

# Workspaces approximate tmux sessions; tabs approximate tmux windows.
new_workspace = "prefix+shift+c"
switch_workspace = "alt+1..9"
next_agent = "prefix+n"
previous_agent = "prefix+p"
workspace_picker = "prefix+s"
navigate_workspace_down = ["j", "down"]
navigate_workspace_up = ["k", "up"]
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
settings = "prefix+alt+s"
new_tab = "prefix+c"
close_tab = "prefix+shift+x"
rename_tab = "prefix+,"
switch_tab = "prefix+1..9"
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"
move_tab_previous = "prefix+ctrl+h"
move_tab_next = "prefix+ctrl+l"

split_horizontal = "prefix+minus"
split_vertical = "prefix+_"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_mode = "prefix+r"
zoom = "prefix+z"

# Swaps are directional, not cyclic.
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

copy_mode = "prefix+enter"
edit_scrollback = "prefix+e" # Uses EDITOR=nvim from common/.zshenv.
# Return to the last pane across tabs/workspaces instead of cycling panes.
last_pane = "prefix+tab"
cycle_pane_next = ""
cycle_pane_previous = ""

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "Navigate left through Neovim / Herdr"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "Navigate down through Neovim / Herdr"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "Navigate up through Neovim / Herdr"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "Navigate right through Neovim / Herdr"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "herdr-arrange.open-tree"
description = "Move pane to another tab or workspace"

# Popup app slots: Ctrl+1..0 after the prefix. Add apps as needed.
[[keys.command]]
key = "prefix+ctrl+1"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"
description = "LazyGit popup"

[[keys.command]]
key = "prefix+ctrl+2"
type = "popup"
command = "htop"
width = "90%"
height = "90%"
description = "htop popup"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "herdr-arrange.open"
description = "Arrange panes (Space cycles, e balances)"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "zenbu-labs.terminal-browser.open-split"
description = "Open Terminal Browser"

[experimental]
kitty_graphics = true

[ui]
mouse_capture = true
copy_on_select = true
prompt_new_tab_name = false
prompt_new_workspace_name = false
tab_bar_position = "top"
pane_borders = true
pane_outer_borders = false
pane_gaps = false
window_title = "{hostname}: {workspace} - {tab}"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "herdr"
