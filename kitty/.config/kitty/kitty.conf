# Tokyo Night Theme
foreground #a9b1d6
background #1e2030

# Normal colors
color0  #32344a
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #ad8ee6
color6  #449dab
color7  #787c99

# Bright colors
color8  #444b6a
color9  #ff7a93
color10 #b9f27c
color11 #ff9e64
color12 #7da6ff
color13 #bb9af7
color14 #0db9d7
color15 #acb0d0

font_family      DankMono Nerd Font Mono
font_size        14

symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

hide_window_decorations yes
background_opacity       0.9
window_padding_width     8
sync_to_monitor          yes

cursor_shape              block
cursor_blink_interval     0.75
cursor_stop_blinking_after 5.0

scrollback_lines        100000
wheel_scroll_multiplier 3.0

shell /usr/bin/zsh

env github=https://github.com/AlanD20

map shift+enter new_window

